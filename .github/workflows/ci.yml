name: CI — Lint + API + Safety Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  ASKDATA_BASE_URL: "https://ask-data-gilt.vercel.app"
  ASKDATA_API_URL: "https://ask-data-gilt.vercel.app/api"

jobs:
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run API tests
        run: pytest tests/test_api/ -m api -v --tb=short --junit-xml=reports/api-results.xml
        env:
          ASKDATA_BASE_URL: ${{ env.ASKDATA_BASE_URL }}
          ASKDATA_API_URL: ${{ env.ASKDATA_API_URL }}
          CI: "true"

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/api-results.xml

  safety-tests:
    name: 🛡️ AI Safety Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run safety tests
        run: pytest tests/test_safety/ -m safety -v --tb=long --junit-xml=reports/safety-results.xml
        env:
          ASKDATA_BASE_URL: ${{ env.ASKDATA_BASE_URL }}
          ASKDATA_API_URL: ${{ env.ASKDATA_API_URL }}
          CI: "true"

      - name: Upload safety test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-test-results
          path: reports/safety-results.xml

      - name: Fail pipeline if safety tests fail
        if: failure()
        run: |
          echo "🚨 SAFETY TESTS FAILED — Merge is BLOCKED"
          echo "All AI safety tests must pass before deployment."
          exit 1
