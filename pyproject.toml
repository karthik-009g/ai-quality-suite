[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askdata-quality-suite"
version = "1.0.0"
description = "AI Quality Suite: Automated Testing & LLM Evaluation Framework for AskData"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AI Quality Engineer" }]

dependencies = [
    # --- Test Framework ---
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-html>=4.1",
    "pytest-timeout>=2.3",
    "allure-pytest>=2.13",

    # --- LLM Evaluation ---
    "deepeval>=1.0",
    "groq>=0.9",
    "litellm>=1.40",

    # --- API Testing ---
    "httpx>=0.27",
    "fastapi>=0.111",

    # --- Browser Testing ---
    "pytest-playwright>=0.5",
    "playwright>=1.45",

    # --- Configuration & Validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",

    # --- Utilities ---
    "jsonschema>=4.22",
    "rich>=13.7",
    "sqlparse>=0.5",

    # --- Code Quality ---
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",  # VCR cassettes for API mocking
    "respx>=0.21",             # HTTPX mock transport
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: API endpoint tests (positive, negative, security)",
    "llm: LLM evaluation tests using DeepEval metrics",
    "e2e: End-to-end browser tests using Playwright",
    "safety: AI safety tests (prompt injection, destructive SQL)",
    "slow: Tests that take >30 seconds",
    "smoke: Quick smoke tests for CI sanity checks",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101", "E501"]  # Allow assert in tests; line length handled by ruff format

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]  # Relax security warnings in test files

[tool.hatch.build.targets.wheel]
packages = ["src/askdata_quality"]
