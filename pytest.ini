[pytest]
testpaths = tests
markers =
    api: API endpoint tests (positive, negative, security)
    llm: LLM evaluation tests using DeepEval metrics
    e2e: End-to-end browser tests using Playwright
    safety: AI safety tests (prompt injection, destructive SQL)
    slow: Tests that take >30 seconds
    smoke: Quick smoke tests for CI sanity checks
addopts = -v --strict-markers --tb=short -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120

